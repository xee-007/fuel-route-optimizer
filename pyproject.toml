[project]
name = "fuel-route-optimizer"
version = "0.1.0"
description = "Django API that plans the cheapest fuel stops along a US driving route."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["planner/migrations"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, B: likely bugs,
# UP: modern syntax, DJ: Django-specific checks.
select = ["E", "F", "I", "B", "UP", "DJ"]
